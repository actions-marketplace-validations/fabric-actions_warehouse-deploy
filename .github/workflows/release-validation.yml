name: Release validation

# Runs before a release is cut (manually) and when a version tag is pushed.
# It never creates tags, releases or Marketplace listings.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being released, e.g. 0.1.0 (no leading v)"
        required: true
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Static validation
        shell: pwsh
        run: ./tests/Validate-Repository.ps1

      - name: Unit tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = './tests/unit'
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c

      - name: Version consistency
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Not a semantic version: '$version'" }
          $problems = @()
          if ((Get-Content CHANGELOG.md -Raw) -notmatch "(?m)^## \[$([regex]::Escape($version))\]") {
            $problems += "CHANGELOG.md has no '## [$version]' section."
          }
          if ((Get-Content README.md -Raw) -notmatch "warehouse-deploy@v$([regex]::Escape($version))") {
            $problems += "README.md does not reference warehouse-deploy@v$version."
          }
          foreach ($f in Get-ChildItem examples -Filter *.yml) {
            if ((Get-Content $f.FullName -Raw) -notmatch "warehouse-deploy@v$([regex]::Escape($version))") {
              $problems += "$($f.Name) does not reference v$version."
            }
          }
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "Release $version is consistent."
